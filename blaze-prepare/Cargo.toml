[package]
name = "blaze-prepare"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Pure-Rust Android arm64 engine-data downloader, verifier, bundler extractor, and resource assembler for Blaze Launcher"

[lib]
crate-type = ["cdylib", "rlib"]
name = "blaze_prepare"

[dependencies]
crc32fast = "1.5"
jni = "0.21"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
zip = { version = "9.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false
debug = true
