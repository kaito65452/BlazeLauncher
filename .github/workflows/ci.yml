name: CI

on:
  push:
    branches:
      - 'feat/**'
      - 'main'
  pull_request:
    branches:
      - 'feat/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run Guard Scripts
        run: |
          chmod +x scripts/guard.sh scripts/scope_guard.sh
          ./scripts/guard.sh
          ./scripts/scope_guard.sh main

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: "on-failure"

      - name: Setup Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/blaze-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/blaze-release.jks" >> $GITHUB_ENV

      - name: Run Tests and Assemble Release
        run: |
          chmod +x gradlew
          RUN_NUM=${GITHUB_RUN_NUMBER:-1}
          V_CODE=$((1000 + RUN_NUM))
          V_NAME="2.6_hotfix-blaze.${RUN_NUM}"
          echo "Building with versionCode=$V_CODE versionName=$V_NAME"
          ./gradlew testDebugUnitTest assembleRelease -PversionCodeOverride="$V_CODE" -PversionNameOverride="$V_NAME" --stacktrace

      - name: Verify Signing Certificate SHA-256
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          for apk in $(find ZalithLauncher/build/outputs/apk/release -name "*.apk"); do
            echo "======================================================="
            echo "Signing certificate verification for: $apk"
            "$APKSIGNER" verify --print-certs "$apk"
            echo "======================================================="
          done

      - name: Upload Signed APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error
