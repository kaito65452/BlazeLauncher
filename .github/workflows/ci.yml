name: CI

on:
  push:
    branches:
      - 'feat/**'
      - 'main'
  pull_request:
    branches:
      - 'feat/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    uses: ./.github/workflows/rust-engine.yml

  ci:
    needs: engine
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run Guard Scripts
        run: |
          chmod +x scripts/guard.sh scripts/scope_guard.sh scripts/test_guards.sh
          ./scripts/guard.sh
          ./scripts/test_guards.sh
          ./scripts/scope_guard.sh main

      - name: Download Rust Engine .so (arm64-v8a)
        uses: actions/download-artifact@v4
        with:
          name: horizon-engine-arm64
          path: ZalithLauncher/src/main/jniLibs/arm64-v8a

      - name: Verify Rust Engine .so Placement
        run: |
          SO_PATH="ZalithLauncher/src/main/jniLibs/arm64-v8a/libhorizon_android.so"
          if [ ! -s "$SO_PATH" ]; then
            echo "ERROR: Missing $SO_PATH after artifact download!" >&2
            exit 1
          fi
          ls -lh "$SO_PATH"
          echo "Engine .so bytes: $(stat -c%s "$SO_PATH")"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: "on-failure"

      - name: Verify OAUTH_CLIENT_ID Configuration
        id: oauth_check
        run: |
          CLIENT_ID_TRIMMED=$(printf '%s' "${OAUTH_CLIENT_ID:-}" | tr -d '[:space:]')
          IS_FORK_PR="false"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            IS_FORK_PR="true"
          fi

          if [ -n "$CLIENT_ID_TRIMMED" ]; then
            CLIENT_ID_LEN=${#CLIENT_ID_TRIMMED}
            echo "OAUTH_CLIENT_ID present: yes (length $CLIENT_ID_LEN)"
            echo "has_client_id=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Secrets & Build Configuration"
              echo "- OAUTH_CLIENT_ID present: yes (length $CLIENT_ID_LEN)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "OAUTH_CLIENT_ID present: no (length 0)"
            echo "has_client_id=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Secrets & Build Configuration"
              echo "- OAUTH_CLIENT_ID present: no (length 0)"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$IS_FORK_PR" = "true" ]; then
              echo "::warning::OAUTH_CLIENT_ID secret is missing or blank on a fork pull request; skipping assembleRelease and running debug/unit tests only."
            else
              echo "ERROR: OAUTH_CLIENT_ID secret is missing or blank. Release builds require OAUTH_CLIENT_ID to be configured in repository secrets." >&2
              exit 1
            fi
          fi

      - name: Setup Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/blaze-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/blaze-release.jks" >> $GITHUB_ENV

      - name: Run Tests and Assemble Release
        run: |
          chmod +x gradlew
          VERSION_CODE=$(( $(date -u +%s) - 1767225600 ))
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_NAME="2.6_hotfix-blaze.${SHORT_SHA}"
          echo "Building with versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          if [ "${{ steps.oauth_check.outputs.has_client_id }}" = "true" ]; then
            ./gradlew testDebugUnitTest assembleRelease -PversionCodeOverride="$VERSION_CODE" -PversionNameOverride="$VERSION_NAME" --stacktrace
          else
            ./gradlew testDebugUnitTest compileReleaseKotlin -PversionCodeOverride="$VERSION_CODE" -PversionNameOverride="$VERSION_NAME" --stacktrace
          fi

      - name: Verify No Debug APK Artifacts Built
        run: |
          DEBUG_APKS=$(find ZalithLauncher/build/outputs/apk/debug -name "*.apk" 2>/dev/null || true)
          if [ -n "$DEBUG_APKS" ]; then
            echo "ERROR: Debug APKs must not be built for distribution:" >&2
            echo "$DEBUG_APKS" >&2
            exit 1
          fi
          echo "✓ Confirmed zero debug APKs exist under ZalithLauncher/build/outputs/apk/debug."

      - name: Verify APK License Hygiene and Non-Debuggable Release
        if: steps.oauth_check.outputs.has_client_id == 'true'
        run: |
          APK_LIST=$(find ZalithLauncher/build/outputs/apk/release -name "*.apk" | sort)
          if [ -z "$APK_LIST" ]; then
            echo "ERROR: No release APK found under ZalithLauncher/build/outputs/apk/release!" >&2
            exit 1
          fi
          APKANALYZER=$(which apkanalyzer 2>/dev/null || find $ANDROID_HOME -name apkanalyzer 2>/dev/null | sort -V | tail -n 1)
          for apk in $APK_LIST; do
            ./scripts/guard.sh --check-release-apk "$apk"
            if [ -n "$APKANALYZER" ] && [ -x "$APKANALYZER" ]; then
              DBG_VAL=$("$APKANALYZER" manifest debuggable "$apk")
              echo "apkanalyzer manifest debuggable ($apk): $DBG_VAL"
              if [ "$DBG_VAL" != "false" ]; then
                echo "ERROR: Distributed APK $apk is debuggable ($DBG_VAL)!" >&2
                exit 1
              fi
            fi
            python3 - "$apk" <<'PY'
          import os, sys, zipfile
          apk = sys.argv[1]
          apk_bytes = os.path.getsize(apk)
          with zipfile.ZipFile(apk, "r") as zf:
              matches = [i for i in zf.infolist() if i.filename.endswith("libhorizon_android.so")]
              print(f"APK size report for {apk}: total={apk_bytes} bytes ({apk_bytes / (1024*1024):.2f} MiB)")
              if not matches:
                  print("ERROR: libhorizon_android.so not packaged in APK!", file=sys.stderr)
                  sys.exit(1)
              for m in matches:
                  print(
                      f"  entry={m.filename} uncompressed={m.file_size} bytes "
                      f"({m.file_size / (1024*1024):.2f} MiB) compressed={m.compress_size} bytes "
                      f"({m.compress_size / (1024*1024):.2f} MiB)"
                  )
          PY
          done

      - name: Verify Signing Certificate SHA-256
        if: steps.oauth_check.outputs.has_client_id == 'true'
        run: |
          EXPECTED_SHA256="5aa533d1c85a38a2190f73761d81c033bf7065091660970653d6c63fbd81a2fc"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          for apk in $(find ZalithLauncher/build/outputs/apk/release -name "*.apk"); do
            echo "======================================================="
            echo "Signing certificate verification for: $apk"
            CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$apk")
            echo "$CERT_OUTPUT"
            if ! echo "$CERT_OUTPUT" | grep -qi "$EXPECTED_SHA256"; then
              echo "ERROR: APK certificate SHA-256 does not match expected $EXPECTED_SHA256!" >&2
              exit 1
            fi
            echo "✓ Signing certificate SHA-256 matched $EXPECTED_SHA256."
            echo "======================================================="
          done

      - name: Verify Monotonic versionCode Against Nightly Release
        if: steps.oauth_check.outputs.has_client_id == 'true'
        run: |
          PRODUCED_APK=$(find ZalithLauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$PRODUCED_APK" ]; then
            echo "ERROR: No release APK found to inspect!"
            exit 1
          fi

          APKANALYZER=$(which apkanalyzer 2>/dev/null || find $ANDROID_HOME -name apkanalyzer 2>/dev/null | sort -V | tail -n 1)
          AAPT=$(which aapt 2>/dev/null || find $ANDROID_HOME -name aapt 2>/dev/null | sort -V | tail -n 1)

          get_version_code() {
            local apk="$1"
            if [ -n "$APKANALYZER" ] && [ -x "$APKANALYZER" ]; then
              "$APKANALYZER" manifest version-code "$apk"
            elif [ -n "$AAPT" ] && [ -x "$AAPT" ]; then
              "$AAPT" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p"
            else
              echo "ERROR: Neither apkanalyzer nor aapt found!" >&2
              exit 1
            fi
          }

          PRODUCED_CODE=$(get_version_code "$PRODUCED_APK")
          echo "======================================================="
          echo "Produced APK: $PRODUCED_APK"
          echo "Produced versionCode: $PRODUCED_CODE"
          echo "======================================================="

          if [ -z "$PRODUCED_CODE" ]; then
            echo "ERROR: Failed to extract versionCode from produced APK!"
            exit 1
          fi

          NIGHTLY_DIR="$RUNNER_TEMP/nightly_asset"
          mkdir -p "$NIGHTLY_DIR"

          if ! gh release view nightly >/dev/null 2>&1; then
            echo "No nightly release found; skipping monotonic comparison."
          else
            echo "Nightly release found. Downloading nightly APK..."
            if gh release download nightly --dir "$NIGHTLY_DIR" --pattern "*.apk" --clobber; then
              NIGHTLY_APK=$(find "$NIGHTLY_DIR" -name "*.apk" | head -n 1)
              if [ -n "$NIGHTLY_APK" ] && [ -f "$NIGHTLY_APK" ]; then
                NIGHTLY_CODE=$(get_version_code "$NIGHTLY_APK")
                echo "Nightly APK: $NIGHTLY_APK"
                echo "Nightly versionCode: $NIGHTLY_CODE"

                if [ -n "$NIGHTLY_CODE" ]; then
                  echo "Comparing versionCode: Produced ($PRODUCED_CODE) vs Nightly ($NIGHTLY_CODE)..."
                  if [ "$PRODUCED_CODE" -le "$NIGHTLY_CODE" ]; then
                    echo "ERROR: Produced versionCode ($PRODUCED_CODE) is not strictly greater than nightly versionCode ($NIGHTLY_CODE)!"
                    exit 1
                  fi
                  echo "✓ Verification passed: Produced versionCode ($PRODUCED_CODE) > Nightly versionCode ($NIGHTLY_CODE)."
                else
                  echo "Warning: Could not read versionCode from nightly APK; skipping comparison."
                fi
              else
                echo "No APK found in nightly release assets; skipping comparison."
              fi
            else
              echo "Could not download nightly APK assets; skipping comparison."
            fi
          fi

      - name: Upload Signed APK Artifacts
        if: steps.oauth_check.outputs.has_client_id == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error
