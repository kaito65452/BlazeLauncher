name: Upstream Watch

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Upstream Commits and Create Summary Issue
        run: |
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          DATE_LABEL=$(date -u +%Y-%m-%d)
          echo "Checking upstream commits since $SINCE"

          echo "## Upstream Commits Summary (Week of $DATE_LABEL)" > report.md
          echo "" >> report.md

          echo "### ZalithLauncher/ZalithLauncher2" >> report.md
          ZL_COMMITS=$(gh api "repos/ZalithLauncher/ZalithLauncher2/commits?since=$SINCE" --jq '.[] | "- [\(.sha[0:7])](\(.html_url)): \(.commit.message | split("\n")[0]) (\(.commit.author.name))"' || true)
          if [ -n "$ZL_COMMITS" ]; then
            echo "$ZL_COMMITS" >> report.md
          else
            echo "No new commits in the past 7 days." >> report.md
          fi
          echo "" >> report.md

          echo "### starling-client/starling" >> report.md
          STARLING_COMMITS=$(gh api "repos/starling-client/starling/commits?since=$SINCE" --jq '.[] | "- [\(.sha[0:7])](\(.html_url)): \(.commit.message | split("\n")[0]) (\(.commit.author.name))"' || true)
          if [ -n "$STARLING_COMMITS" ]; then
            echo "$STARLING_COMMITS" >> report.md
          else
            echo "No new commits in the past 7 days." >> report.md
          fi
          echo "" >> report.md

          echo "> Automated summary generated by upstream-watch workflow. This workflow never merges changes automatically." >> report.md

          gh issue create \
            --title "Upstream Sync Summary: $DATE_LABEL" \
            --body-file report.md
