name: Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run Guard Scripts
        run: |
          chmod +x scripts/guard.sh scripts/scope_guard.sh
          ./scripts/guard.sh
          ./scripts/scope_guard.sh main

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: "on-failure"

      - name: Verify OAUTH_CLIENT_ID Configuration
        run: |
          CLIENT_ID_TRIMMED=$(printf '%s' "${OAUTH_CLIENT_ID:-}" | tr -d '[:space:]')
          if [ -n "$CLIENT_ID_TRIMMED" ]; then
            CLIENT_ID_LEN=${#CLIENT_ID_TRIMMED}
            echo "OAUTH_CLIENT_ID present: yes (length $CLIENT_ID_LEN)"
            {
              echo "### Secrets & Build Configuration"
              echo "- OAUTH_CLIENT_ID present: yes (length $CLIENT_ID_LEN)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "OAUTH_CLIENT_ID present: no (length 0)"
            {
              echo "### Secrets & Build Configuration"
              echo "- OAUTH_CLIENT_ID present: no (length 0)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ERROR: OAUTH_CLIENT_ID secret is missing or blank. Nightly builds require OAUTH_CLIENT_ID to be configured in repository secrets." >&2
            exit 1
          fi

      - name: Setup Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/blaze-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/blaze-release.jks" >> $GITHUB_ENV

      - name: Assemble Release APK
        run: |
          chmod +x gradlew
          VERSION_CODE=$(( $(date -u +%s) - 1767225600 ))
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_NAME="2.6_hotfix-blaze.${SHORT_SHA}"
          echo "Building nightly with versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          ./gradlew assembleRelease -PversionCodeOverride="$VERSION_CODE" -PversionNameOverride="$VERSION_NAME" --stacktrace

      - name: Verify Signing Certificate SHA-256
        run: |
          EXPECTED_SHA256="5aa533d1c85a38a2190f73761d81c033bf7065091660970653d6c63fbd81a2fc"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          for apk in $(find ZalithLauncher/build/outputs/apk/release -name "*.apk"); do
            echo "======================================================="
            echo "Signing certificate verification for: $apk"
            CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$apk")
            echo "$CERT_OUTPUT"
            if ! echo "$CERT_OUTPUT" | grep -qi "$EXPECTED_SHA256"; then
              echo "ERROR: Nightly APK certificate SHA-256 does not match expected $EXPECTED_SHA256!" >&2
              exit 1
            fi
            echo "✓ Signing certificate SHA-256 matched $EXPECTED_SHA256."
            echo "======================================================="
          done

      - name: Inspect Produced APK Version
        run: |
          APKANALYZER=$(which apkanalyzer 2>/dev/null || find $ANDROID_HOME -name apkanalyzer 2>/dev/null | sort -V | tail -n 1)
          for apk in $(find ZalithLauncher/build/outputs/apk/release -name "*.apk"); do
            echo "======================================================="
            echo "Inspecting: $apk"
            echo "versionCode: $("$APKANALYZER" manifest version-code "$apk")"
            echo "versionName: $("$APKANALYZER" manifest version-name "$apk")"
            DBG_VAL=$("$APKANALYZER" manifest debuggable "$apk")
            echo "debuggable: $DBG_VAL"
            if [ "$DBG_VAL" != "false" ]; then
              echo "ERROR: Nightly APK $apk must not be debuggable ($DBG_VAL)!" >&2
              exit 1
            fi
            ./scripts/guard.sh --check-release-apk "$apk"
            echo "======================================================="
          done

      - name: Ensure Nightly Pre-release Exists
        run: |
          if ! gh release view nightly >/dev/null 2>&1; then
            echo "Creating nightly pre-release..."
            gh release create nightly \
              --prerelease \
              --title "Blaze Launcher Nightly" \
              --notes "Automated nightly builds of Blaze Launcher."
          fi

      - name: Upload Signed APKs to Nightly Release
        run: |
          echo "Uploading release APKs to nightly release..."
          gh release upload nightly ZalithLauncher/build/outputs/apk/release/*.apk --clobber
