name: Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run Guard Scripts
        run: |
          chmod +x scripts/guard.sh scripts/scope_guard.sh
          ./scripts/guard.sh
          ./scripts/scope_guard.sh main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: "on-failure"

      - name: Setup Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/blaze-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/blaze-release.jks" >> $GITHUB_ENV

      - name: Assemble Release APK
        run: |
          chmod +x gradlew
          RUN_NUM=${GITHUB_RUN_NUMBER:-1}
          V_CODE=$((1000 + RUN_NUM))
          V_NAME="2.6_hotfix-blaze.${RUN_NUM}"
          ./gradlew assembleRelease -PversionCodeOverride="$V_CODE" -PversionNameOverride="$V_NAME" --stacktrace

      - name: Verify Signing Certificate
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          for apk in $(find ZalithLauncher/build/outputs/apk/release -name "*.apk"); do
            echo "Verifying $apk:"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Ensure Nightly Pre-release Exists
        run: |
          if ! gh release view nightly >/dev/null 2>&1; then
            echo "Creating nightly pre-release..."
            gh release create nightly \
              --prerelease \
              --title "Blaze Launcher Nightly" \
              --notes "Automated nightly builds of Blaze Launcher."
          fi

      - name: Upload Signed APKs to Nightly Release
        run: |
          echo "Uploading release APKs to nightly release..."
          gh release upload nightly ZalithLauncher/build/outputs/apk/release/*.apk --clobber
